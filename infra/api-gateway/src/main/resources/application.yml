server:
  port: 8888

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
            - id: profile-service
              uri: lb://profile-service
              predicates:
                - Path=/profile/**
              filters:
                - StripPrefix=1
            - id: post-service
              uri: lb://post-service
              predicates:
                - Path=/post/**
              filters:
                - StripPrefix=1
            - id: comment-service
              uri: lb://comment-service
              predicates:
                - Path=/comment/**
              filters:
                - StripPrefix=1
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/interaction/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notification/**
              filters:
                - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.social_media: DEBUG

# CẤU HÌNH JWT CHO GATEWAY
application:
  security:
    jwt:
      secretKey: "12345678901234567890123456789012"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
