server:
  port: 8888

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 1
  cloud:
    gateway:
      routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
            - id: profile-service
              uri: lb://profile-service
              predicates:
                - Path=/profile/**
              filters:
                - StripPrefix=1
            - id: post-service
              uri: lb://post-service
              predicates:
                - Path=/post/**
              filters:
                - StripPrefix=1
            - id: comment-service
              uri: lb://comment-service
              predicates:
                - Path=/comment/**
              filters:
                - StripPrefix=1
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/interaction/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notification/**
              filters:
                - StripPrefix=1
            - id: follower-service
              uri: lb://follower-service
              predicates:
                - Path=/follow/**
              filters:
                - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.social_media: DEBUG

# CẤU HÌNH JWT CHO GATEWAY
application:
  security:
    jwt:
      secretKey: "12345678901234567890123456789012"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true    # Bắt buộc Eureka phải dùng IP thay vì tên máy (Tránh lỗi kết nối)
    instance-id: ${spring.application.name}:${server.port}  # Đặt tên định danh cho đẹp trên giao diện Eureka

management:
  tracing:
    sampling:
      probability: 1.0 # Bắt buộc ghi nhận 100% số request
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"

