services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  kafka:
   image: confluentinc/cp-kafka:7.6.0 # Dùng bản cao hẳn để KRaft chạy mượt nhất
   container_name: kafka
   ports:
     - "9092:9092"
   environment:
     # Bật chế độ KRaft (Đóng vai trò vừa là Broker vừa là Controller điều phối)
     KAFKA_NODE_ID: 1
     KAFKA_PROCESS_ROLES: 'broker,controller'

     # Cấu hình cổng kết nối
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
     KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'

     # Sửa lỗi 'GiangHieu.mshome.net' bằng cách chỉ định rõ localhost ở cổng 9092
     KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'

     # Cơ chế bỏ Zookeeper cần một cái ID cụ thể cho Cluster (để chuỗi ngẫu nhiên chuẩn KRaft)
     KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
     KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
     CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # ID định danh cho cụm Kafka tự quản lý

     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0