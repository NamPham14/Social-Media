name: social-media-platform

services:

  # ===== DATABASES (Database-per-service pattern) =====
  identity-db:
    image: postgres:16-alpine
    container_name: social_media_identity_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: social_media
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-db:
    image: postgres:16-alpine
    container_name: social_media_profile_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  post-db:
    image: postgres:16-alpine
    container_name: social_media_post_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: post_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - post-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d post_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  comment-db:
    image: postgres:16-alpine
    container_name: social_media_comment_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: comment_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: social_media_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== INFRASTRUCTURE =====
  eureka-server:
    build:
      context: .
      dockerfile: infra/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: infra/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== BUSINESS SERVICES =====
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/social_media
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  profile-service:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: profile-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-db:5432/demo
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      profile-db:
        condition: service_healthy

  post-service:
    build:
      context: .
      dockerfile: services/post-service/Dockerfile
    container_name: post-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-db:5432/post_service
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      post-db:
        condition: service_healthy

  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    container_name: comment-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comment_service
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy

volumes:
  identity-db-data:
  profile-db-data:
  post-db-data:
  comment-db-data:
  redis-data: