name: social-media-platform

services:

  # ===== DATABASES (Database-per-service pattern) =====
  identity-db:
    image: postgres:16-alpine
    container_name: social_media_identity_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: social_media
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-db:
    image: postgres:16-alpine
    container_name: social_media_profile_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  post-db:
    image: postgres:16-alpine
    container_name: social_media_post_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: post_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - post-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d post_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  comment-db:
    image: postgres:16-alpine
    container_name: social_media_comment_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: comment_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  interaction-db:
    image: postgres:16-alpine
    container_name: social_media_interaction_db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: interaction_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - interaction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interaction_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: social_media_notification_db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== KAFKA (KRaft mode) =====
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: social_media_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: social_media_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== INFRASTRUCTURE =====
  eureka-server:
    build:
      context: .
      dockerfile: infra/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: infra/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== BUSINESS SERVICES =====
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/social_media
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  profile-service:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: profile-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-db:5432/demo
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      profile-db:
        condition: service_healthy

  post-service:
    build:
      context: .
      dockerfile: services/post-service/Dockerfile
    container_name: post-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-db:5432/post_service
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      eureka-server:
        condition: service_healthy
      post-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    container_name: comment-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comment_service
      SPRING_DATASOURCE_PASSWORD: 123456
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      eureka-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  follower-service:
    build:
      context: .
      dockerfile: services/follower-service/Dockerfile
    container_name: follower-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/social_media
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  interaction-service:
    build:
      context: .
      dockerfile: services/interaction-service/Dockerfile
    container_name: interaction-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://interaction-db:5432/interaction_service
      SPRING_DATASOURCE_PASSWORD: 123456
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      eureka-server:
        condition: service_healthy
      interaction-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_service
      SPRING_DATASOURCE_PASSWORD: 123456
    depends_on:
      eureka-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      # ===== OBSERVABILITY STACK =====

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: social_media_zipkin
    ports:
        - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: social_media_prometheus
    ports:
        - "9090:9090"
    volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: social_media_grafana
    ports:
       - "3000:3000"
    environment:
       - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
       - prometheus

volumes:
  identity-db-data:
  profile-db-data:
  post-db-data:
  comment-db-data:
  interaction-db-data:
  notification-db-data:
  redis-data:


