server:
  port: 8085

spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/comment_service
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}