server:
  port: 8085

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

spring:
  application:
    name: comment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/comment_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/comment
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: comment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  cloud:
    openfeign:
      client:
        config:
          post-service:
            # Two bounded attempts stay under about 4.1s: 1s connect + 2s read + 100ms backoff.
            connectTimeout: 1000
            readTimeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true    # Bắt buộc Eureka phải dùng IP thay vì tên máy (Tránh lỗi kết nối)
    instance-id: ${spring.application.name}:${server.port}  # Đặt tên định danh cho đẹp trên giao diện Eureka


management:
  metrics:
    tags:
      service: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  retry:
    instances:
      postAvailability:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - com.social_media.commentservice.domain.exception.TargetNotFoundException
          - com.social_media.commentservice.domain.exception.InvalidCommentException
          - com.social_media.commentservice.domain.exception.DependencyRejectedException

  circuitbreaker:
    instances:
      postAvailability:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.social_media.commentservice.domain.exception.TargetNotFoundException
          - com.social_media.commentservice.domain.exception.InvalidCommentException
          - com.social_media.commentservice.domain.exception.DependencyRejectedException

messaging:
  topics:
    post-deleted: post-deleted-topic
    post-comments-deleted: post-comments-deleted-topic
    comment-created: comment-created-topic
    comment-replied: comment-replied-topic
  outbox:
    enabled: true
    poll-delay-ms: 1000
    batch-size: 100
    retry-delay-ms: 5000
    publish-timeout-seconds: 10
    retention-days: 7
    cleanup-cron: "0 0 3 * * *"
  retry:
    max-attempts: 5
    backoff-ms: 1000
    dlt-suffix: -comment-dlt
    dlt-publish-timeout-seconds: 10
