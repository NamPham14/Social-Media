server:
  port: 8085

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/comment_service
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    openfeign:
      client:
        config:
          post-service:
            # Two bounded attempts stay under about 4.1s: 1s connect + 2s read + 100ms backoff.
            connectTimeout: 1000
            readTimeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true    # Bắt buộc Eureka phải dùng IP thay vì tên máy (Tránh lỗi kết nối)
    instance-id: ${spring.application.name}:${server.port}  # Đặt tên định danh cho đẹp trên giao diện Eureka


management:
  metrics:
    tags:
      service: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  retry:
    instances:
      postAvailability:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - com.social_media.commentservice.domain.exception.TargetNotFoundException
          - com.social_media.commentservice.domain.exception.InvalidCommentException
          - com.social_media.commentservice.domain.exception.DependencyRejectedException
  circuitbreaker:
    instances:
      postAvailability:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.social_media.commentservice.domain.exception.TargetNotFoundException
          - com.social_media.commentservice.domain.exception.InvalidCommentException
          - com.social_media.commentservice.domain.exception.DependencyRejectedException
