spring:
  application:
    name: profile-service
  datasource:
#    url: jdbc:postgresql://localhost:5433/demo
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: profile-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true    # Bắt buộc Eureka phải dùng IP thay vì tên máy (Tránh lỗi kết nối)
    instance-id: ${spring.application.name}:${server.port}  # Đặt tên định danh cho đẹp trên giao diện Eureka
server:
  port: 8082

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dqdfnfhml}
  api-key: ${CLOUDINARY_API_KEY:993738775593578}
  api-secret: ${CLOUDINARY_API_SECRET:5NB3dn2JJGxKE6xk5c7kz3ATOic}

logging:
  level:
    org.springframework.web: DEBUG
    com.social_media: DEBUG
