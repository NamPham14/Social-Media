spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true    # Bắt buộc Eureka phải dùng IP thay vì tên máy (Tránh lỗi kết nối)
    instance-id: ${spring.application.name}:${server.port}  # Đặt tên định danh cho đẹp trên giao diện Eureka
server:
  port: 8082

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy}
  api-key: ${CLOUDINARY_API_KEY:dummy}
  api-secret: ${CLOUDINARY_API_SECRET:dummy}

logging:
  level:
    org.springframework.web: DEBUG
    com.social_media: DEBUG
