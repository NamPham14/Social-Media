spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 4000
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_media
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

application:
  security:
    jwt:
      secretKey: "12345678901234567890123456789012"

eureka:
  client:
    service-url:
       defaultZone: http://localhost:8761/eureka/
server:
  port: 8081

logging:
  level:
    org.springframework.web: DEBUG
    com.social_media: DEBUG
