server:
  port: 8086

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

spring:
  application:
    name: interaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/interaction_service
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    openfeign:
      client:
        config:
          post-service:
            connectTimeout: 1000
            readTimeout: 2000
          comment-service:
            connectTimeout: 1000
            readTimeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  retry:
    instances:
      postAvailability:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - com.social_media.interactionservice.domain.exception.TargetNotFoundException
          - com.social_media.interactionservice.domain.exception.ReactionConflictException
      commentAvailability:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - com.social_media.interactionservice.domain.exception.TargetNotFoundException
  circuitbreaker:
    instances:
      postAvailability:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      commentAvailability:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
