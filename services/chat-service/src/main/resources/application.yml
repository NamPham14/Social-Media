server:
  port: 8088
spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5438/chat_service
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    properties.hibernate.format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
messaging:
  topics:
    message-sent: chat-message-sent-topic
