spring:
  application:
    name: follower-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_media
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # từ string hoặc int => chuyển ra byte
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # từ object chuyển ra JSON

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

server:
  port: 8084

logging:
  level:
    org.springframework.web: DEBUG
    com.social_media: DEBUG
