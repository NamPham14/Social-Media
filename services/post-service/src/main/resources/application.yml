server:
  port: 8082
spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://localhost:5432/post_service
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update    # dev only, prod ??i qua Flyway
    properties.hibernate.format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
